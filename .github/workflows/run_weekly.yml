name: Weekly Moasis Automation

on:
  schedule:
    # UTC 기준 금요일 08:00 (한국 시간 매주 금요일 오후 5:00)
    - cron: '0 8 * * 5'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          pip install gspread oauth2client selenium

      - name: 수집 프로그램 실행
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          MOASIS_ACCOUNTS: ${{ secrets.MOASIS_ACCOUNTS }}
        run: python moasis_collector.py
